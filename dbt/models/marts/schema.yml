version: 2

models:
  - name: dim_customer
    description: Customer dimension, surrogate key scoped per tenant.
    columns:
      - name: customer_key
        tests: [not_null, unique]
      - name: gender
        tests:
          - accepted_values:
              values: ['male', 'female']

  - name: dim_product
    description: Product dimension with category and brand.
    columns:
      - name: product_key
        tests: [not_null, unique]

  - name: dim_store
    description: Store dimension.
    columns:
      - name: store_key
        tests: [not_null, unique]
      - name: store_type
        tests:
          - accepted_values:
              values: ['minimarket', 'supermarket', 'express']

  - name: dim_promotion
    description: Promotion dimension.
    columns:
      - name: promo_key
        tests: [not_null, unique]
      - name: promo_type
        tests:
          - accepted_values:
              values: ['discount', 'bundle', 'cashback']

  - name: dim_date
    description: Date spine covering the observed transaction date range.
    columns:
      - name: date_key
        tests: [not_null, unique]

  - name: fact_sales
    description: One row per transaction line item, enriched with store/customer/promo context.
    columns:
      - name: sale_key
        tests: [not_null, unique]
      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: store_key
        tests:
          - relationships:
              to: ref('dim_store')
              field: store_key
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: payment_method
        tests:
          - accepted_values:
              values: ['cash', 'debit', 'credit', 'e-wallet']

  - name: fact_promotion_usage
    description: One row per promotion applied to a transaction.
    columns:
      - name: promotion_usage_key
        tests: [not_null, unique]
      - name: promo_key
        tests:
          - relationships:
              to: ref('dim_promotion')
              field: promo_key
