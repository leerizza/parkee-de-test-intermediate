x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-parkee_airflow_secret}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "9000"
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - pipeline_state:/opt/airflow/pipeline/state
    - dbt_docs:/opt/airflow/dbt/target
  depends_on:
    airflow-postgres:
      condition: service_healthy
    clickhouse:
      condition: service_started

services:
  postgres:
    image: postgres:15
    container_name: parkee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkee}
      POSTGRES_USER: ${POSTGRES_USER:-parkee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parkee_secret}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parkee} -d ${POSTGRES_DB:-parkee}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seeder:
    build:
      context: ./seed
      dockerfile: Dockerfile
    container_name: parkee-seeder
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-parkee}
      POSTGRES_USER: ${POSTGRES_USER:-parkee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parkee_secret}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: parkee-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT:-8124}:8123"
      - "${CLICKHOUSE_NATIVE_HOST_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret}
      CLICKHOUSE_DB: raw
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  airflow-postgres:
    image: postgres:15
    container_name: parkee-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: parkee-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER:-admin} \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname admin --lastname admin --role Admin \
          --email admin@parkee.local || true

  airflow-webserver:
    <<: *airflow-common
    container_name: parkee-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: parkee-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: parkee-api
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret}
      CLICKHOUSE_ANALYTICS_DB: analytics
    ports:
      - "8000:8000"
    depends_on:
      - clickhouse

  dashboard:
    image: nginx:1.27-alpine
    container_name: parkee-dashboard
    restart: unless-stopped
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    depends_on:
      - api

  dbt-docs:
    image: nginx:1.27-alpine
    container_name: parkee-dbt-docs
    restart: unless-stopped
    volumes:
      - dbt_docs:/data:ro
      - ./dbt/docs-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"

volumes:
  postgres_data:
  clickhouse_data:
  airflow_postgres_data:
  airflow_logs:
  pipeline_state:
  dbt_docs:
